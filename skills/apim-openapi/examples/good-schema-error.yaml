openapi: 3.0.1
info:
  title: MonitoringProduct
  description: "Manages a _MonitoringProduct_.\n"
  version: v1
servers:
  - url: https://api.dev.aitms.int.sap/public/api/monitoring-product/v1
paths:
  /:
    post:
      tags:
        - MonitoringProduct
      summary: Add Monitoring Product.
      description: "Add a _MonitoringProduct_.\n\n### MonitoringProduct Status Id\n\n\nThe following values are valid as _productStatusId_:  \n\n|MonitoringProduct Status Id| MonitoringProduct Status Name |\n|-|-|\n|e1aec68a-68c5-4edf-b0f2-82538fd2c526| Enabled|\n|abc838b3-7145-49bd-abed-378069c17e78| Disabled|\n\n### Integration Level Id\n\n\nThe following values are valid as _integrationLevelId_:  \n\n|Integration Level Id| Integration Level Name |\n|-|-|\n|8f1a0105-36dc-404d-9ada-f16b68624e0a| Basic|\n|4fee9f12-f975-444c-9bed-a9227db9d24c| Standard|\n|3f0809a0-9092-471a-9bae-1c1db1057b9d| Premium|\n\n### Constraints\n\n\n- The authenticated user has to be admin.            "
      operationId: create-a-product
      parameters:
        - name: Cams-Correlation-Id
          in: header
          description: Format - uuid. Unique identifier value that is attached to requests and messages that allow reference to a particular transaction or event chain.
          schema:
            enum:
              - c2aea097-7119-420d-b98e-c4c05e99ee42
            type: string
      requestBody:
        description: Body for a new MonitoringProduct.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MonitoringProductPost'
            example:
              name: SCOM
              description: SCOM Product
              overview: Detailed overview of the monitoring product.
              integrationLevelId: 8f1a0105-36dc-404d-9ada-f16b68624e0a
              productStatusId: e1aec68a-68c5-4edf-b0f2-82538fd2c526
              tagIds:
                - F4458FCF-A6A5-47D9-AF73-E06008B6B5A2
              iconMediaType: image/png
              icon: 
              monitoringPropertyIds:
                - 8d1b95c3-cf93-4871-afe5-11ab94b05bfd
      responses:
        '201':
          description: Created
          headers:
            Cams-Correlation-Id:
              description: Correlation Id.
              required: true
              schema:
                type: string
                format: uuid
                example: c2aea097-7119-420d-b98e-c4c05e99ee42
            Cams-Build-Id:
              description: Build Id.
              required: true
              schema:
                type: integer
                example: 16202
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MonitoringProductGet'
              example:
                monitoringProductId: 72206c58-9c2f-40b0-b885-df802edfcedf
                name: AITMS
                description: SCOM Product
                overview: Detailed overview of the monitoring product.
                integrationLevelId: 8f1a0105-36dc-404d-9ada-f16b68624e0a
                productStatusId: e1aec68a-68c5-4edf-b0f2-82538fd2c526
                tagIds:
                  - F4458FCF-A6A5-47D9-AF73-E06008B6B5A2
                iconMediaType: image/png
                icon: 
                monitoringPropertyIds:
                  - 8d1b95c3-cf93-4871-afe5-11ab94b05bfd
                identifier: PR00000001
                created: '2024-01-31T01:15:30.0000000+00:00'
                createdByUserId: 1cee77dd-19f5-487b-be24-560f61f71aac
                modified: '2024-01-31T01:15:30.0000000+00:00'
                modifiedByUserId: bc610734-c686-4c04-9aa3-f022a010f1d9
        '400':
          description: Bad Request
          headers:
            Cams-Correlation-Id:
              description: Correlation Id.
              required: true
              schema:
                type: string
                format: uuid
                example: c2aea097-7119-420d-b98e-c4c05e99ee42
            Cams-Build-Id:
              description: Build Id.
              required: true
              schema:
                type: integer
                example: 16202
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: Body is not a valid JSON-Document.
                camsCorrelationId: c2aea097-7119-420d-b98e-c4c05e99ee42
        '403':
          description: Forbidden
          headers:
            Cams-Correlation-Id:
              description: Correlation Id.
              required: true
              schema:
                type: string
                format: uuid
                example: c2aea097-7119-420d-b98e-c4c05e99ee42
            Cams-Build-Id:
              description: Build Id.
              required: true
              schema:
                type: integer
                example: 16202
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: The current user does not have required permissions.
                camsCorrelationId: c2aea097-7119-420d-b98e-c4c05e99ee42
    get:
      tags:
        - MonitoringProduct
      summary: Get Monitoring Products.
      description: "Get all _Monitoring Products_.\n\n### MonitoringProduct Status Id\n\n\nThe following values are valid as _productStatusId_:  \n\n|MonitoringProduct Status Id| MonitoringProduct Status Name |\n|-|-|\n|e1aec68a-68c5-4edf-b0f2-82538fd2c526| Enabled|\n|abc838b3-7145-49bd-abed-378069c17e78| Disabled|\n\n### Integration Level Id\n\n\nThe following values are valid as _integrationLevelId_:  \n\n|Integration Level Id| Integration Level Name |\n|-|-|\n|8f1a0105-36dc-404d-9ada-f16b68624e0a| Basic|\n|4fee9f12-f975-444c-9bed-a9227db9d24c| Standard|\n|3f0809a0-9092-471a-9bae-1c1db1057b9d| Premium|"
      operationId: get-products
      parameters:
        - name: Cams-Correlation-Id
          in: header
          description: Format - uuid. Unique identifier value that is attached to requests and messages that allow reference to a particular transaction or event chain.
          required: true
          schema:
            enum:
              - c2aea097-7119-420d-b98e-c4c05e99ee42
            type: string
            format: uuid
            example: c2aea097-7119-420d-b98e-c4c05e99ee42
      responses:
        '200':
          description: OK
          headers:
            Cams-Correlation-Id:
              description: Correlation Id.
              required: true
              schema:
                type: string
                format: uuid
                example: c2aea097-7119-420d-b98e-c4c05e99ee42
            Cams-Build-Id:
              description: Build Id.
              required: true
              schema:
                type: integer
                example: 16202
            Cams-Result-Count:
              description: Count of returned items.
              required: true
              schema:
                type: integer
                example: 7
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MonitoringProductGet'
              example:
                - monitoringProductId: 72206c58-9c2f-40b0-b885-df802edfcedf
                  name: AITMS
                  description: SCOM Product
                  overview: Detailed overview of the monitoring product.
                  integrationLevelId: 8f1a0105-36dc-404d-9ada-f16b68624e0a
                  productStatusId: e1aec68a-68c5-4edf-b0f2-82538fd2c526
                  tagIds:
                    - F4458FCF-A6A5-47D9-AF73-E06008B6B5A2
                  iconMediaType: image/png
                  icon: 
                  monitoringPropertyIds:
                    - 8d1b95c3-cf93-4871-afe5-11ab94b05bfd
                  identifier: PR00000001
                  created: '2024-01-31T01:15:30.0000000+00:00'
                  createdByUserId: 1cee77dd-19f5-487b-be24-560f61f71aac
                  modified: '2024-01-31T01:15:30.0000000+00:00'
                  modifiedByUserId: bc610734-c686-4c04-9aa3-f022a010f1d9
        '400':
          description: Bad Request
          headers:
            Cams-Correlation-Id:
              description: Correlation Id.
              required: true
              schema:
                type: string
                format: uuid
                example: c2aea097-7119-420d-b98e-c4c05e99ee42
            Cams-Build-Id:
              description: Build Id.
              required: true
              schema:
                type: integer
                example: 16202
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: An error occurred.
                camsCorrelationId: c2aea097-7119-420d-b98e-c4c05e99ee42

components:
  schemas:
    MonitoringProductPost:
      required:
        - name
        - description
        - productStatusId
        - integrationLevelId
      type: object
      properties:
        name:
          maxLength: 32
          pattern: '^(?! )[a-zA-Z0-9_\\-\\s]{1,32}(?<! )$'
          type: string
          description: Name of the monitoring product.
          example: SCOM
        description:
          maxLength: 256
          type: string
          description: Description of the monitoring product.
          example: SCOM Product
        overview:
          type: string
          description: Overview of the monitoring product.
          example: Detailed overview of the monitoring product.
        integrationLevelId:
          enum:
            - 8f1a0105-36dc-404d-9ada-f16b68624e0a
            - 4fee9f12-f975-444c-9bed-a9227db9d24c
            - 3f0809a0-9092-471a-9bae-1c1db1057b9d
          type: string
          description: "Unique Id of the integration level.\n\nThe following values can be used:  \n\n\n|Integration Level Id| Integration Level Name |\n|-|-|\n|8f1a0105-36dc-404d-9ada-f16b68624e0a| Basic|\n|4fee9f12-f975-444c-9bed-a9227db9d24c| Standard|\n|3f0809a0-9092-471a-9bae-1c1db1057b9d| Premium|\n"
          format: uuid
          example: 8f1a0105-36dc-404d-9ada-f16b68624e0a
        productStatusId:
          enum:
            - e1aec68a-68c5-4edf-b0f2-82538fd2c526
            - abc838b3-7145-49bd-abed-378069c17e78
          type: string
          description: "Unique Id of the monitoring product status.\n\nThe following values can be used:  \n\n|MonitoringProduct Status Id| MonitoringProduct Status Name |\n|-|-|\n|e1aec68a-68c5-4edf-b0f2-82538fd2c526| Enabled|\n|abc838b3-7145-49bd-abed-378069c17e78| Disabled|\n"
          format: uuid
          example: e1aec68a-68c5-4edf-b0f2-82538fd2c526
        tagIds:
          type: array
          items:
            type: string
            format: uuid
            example: F4458FCF-A6A5-47D9-AF73-E06008B6B5A2
          description: Unique Id of the tags.
        iconMediaType:
          enum:
            - image/png
            - image/jpeg
            - image/jpg
            - image/gif
          type: string
          description: Content-Type of Icon.
          nullable: true
          example: image/png
        icon:
          type: string
          description: Image of the monitoring product.
          format: byte
          nullable: true
          example: 
        monitoringPropertyIds:
          type: array
          items:
            type: string
            description: Unique Id of the properties.
            format: uuid
            example: 8d1b95c3-cf93-4871-afe5-11ab94b05bfd
          description: Unique Ids of the properties.
      description: Create Monitoring Product message
    MonitoringProductGet:
      required:
        - name
        - description
      allOf:
        - $ref: '#/components/schemas/MonitoringProductPut'
        - type: object
          properties:
            monitoringProductId:
              type: string
              description: Unique Id of the monitoring product.
              format: uuid
              example: 72206c58-9c2f-40b0-b885-df802edfcedf
            name:
              maxLength: 28
              type: string
              description: Unique name of the monitoring product.
              example: AITMS
            identifier:
              maxLength: 10
              pattern: '^PR[0-9]{8}$'
              type: string
              description: Unique identifier of the monitoring product.
              example: PR00000001
            created:
              type: string
              description: Date and time when the entry was created.
              format: date-time
              example: '2024-01-31T01:15:30.0000000+00:00'
            createdByUserId:
              type: string
              description: User Id who created the entry.
              format: uuid
              example: 1cee77dd-19f5-487b-be24-560f61f71aac
            modified:
              type: string
              description: Date and time when the entry was last modified.
              format: date-time
              example: '2024-01-31T01:15:30.0000000+00:00'
            modifiedByUserId:
              type: string
              description: User Id who did the last modification.
              format: uuid
              example: bc610734-c686-4c04-9aa3-f022a010f1d9
    MonitoringProductPut:
      required:
        - monitoringProductId
        - name
        - description
        - productStatusId
        - integrationLevelId
      type: object
      properties:
        monitoringProductId:
          type: string
          description: Unique Id of the monitoring product.
          format: uuid
          example: 72206c58-9c2f-40b0-b885-df802edfcedf
        name:
          maxLength: 32
          pattern: '^(?! )[a-zA-Z0-9_\\-\\s]{1,32}(?<! )$'
          type: string
          description: Name of the monitoring product.
          example: SCOM
        description:
          maxLength: 256
          type: string
          description: Description of the monitoring product.
          example: SCOM Product
        overview:
          type: string
          description: Overview of the monitoring product.
          example: Detailed overview of the monitoring product.
        integrationLevelId:
          enum:
            - 8f1a0105-36dc-404d-9ada-f16b68624e0a
            - 4fee9f12-f975-444c-9bed-a9227db9d24c
            - 3f0809a0-9092-471a-9bae-1c1db1057b9d
          type: string
          description: "Unique Id of the integration level.\n\nThe following values can be used:  \n\n\n|Integration Level Id| Integration Level Name |\n|-|-|\n|8f1a0105-36dc-404d-9ada-f16b68624e0a| Basic|\n|4fee9f12-f975-444c-9bed-a9227db9d24c| Standard|\n|3f0809a0-9092-471a-9bae-1c1db1057b9d| Premium|\n"
          format: uuid
          example: 8f1a0105-36dc-404d-9ada-f16b68624e0a
        productStatusId:
          enum:
            - e1aec68a-68c5-4edf-b0f2-82538fd2c526
            - abc838b3-7145-49bd-abed-378069c17e78
          type: string
          description: "Unique Id of the monitoring product status.\n\nThe following values can be used:  \n\n|MonitoringProduct Status Id| MonitoringProduct Status Name |\n|-|-|\n|e1aec68a-68c5-4edf-b0f2-82538fd2c526| Enabled|\n|abc838b3-7145-49bd-abed-378069c17e78| Disabled|\n"
          format: uuid
          example: e1aec68a-68c5-4edf-b0f2-82538fd2c526
        tagIds:
          type: array
          items:
            type: string
            format: uuid
            example: F4458FCF-A6A5-47D9-AF73-E06008B6B5A2
          description: Unique Id of the tags.
        iconMediaType:
          enum:
            - image/png
            - image/jpeg
            - image/jpg
            - image/gif
          type: string
          description: Content-Type of Icon.
          nullable: true
          example: image/png
        icon:
          type: string
          description: Image of the monitoring product.
          format: byte
          nullable: true
          example: 
        monitoringPropertyIds:
          type: array
          items:
            type: string
            description: Unique Id of the properties.
            format: uuid
            example: 8d1b95c3-cf93-4871-afe5-11ab94b05bfd
          description: Unique Ids of the properties.
      description: Update a product.
    Error:
      type: object
      properties:
        message:
          type: string
          description: Message for current request.
          example: Body is not a valid JSON-Document.
        camsCorrelationId:
          type: string
          description: Correlation Id.
          format: uuid
          example: c2aea097-7119-420d-b98e-c4c05e99ee42
      description: Error message.



  securitySchemes:
    apiKeyHeader:
      type: apiKey
      name: Ocp-Apim-Subscription-Key
      in: header
    apiKeyQuery:
      type: apiKey
      name: subscription-key
      in: query
security:
  - apiKeyHeader: [ ]
  - apiKeyQuery: [ ]